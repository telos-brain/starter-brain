name: Telos Brain
code: BRA
prefix: BRA
version: 36
categories:
  - name: Concepts
    description: "The foundational theory of Telos Brain: what it is, how it works,
      its core components (brain schema, agent, memory, skills), key
      terminology, and the mental models needed to use the platform effectively.
      The entry point for understanding what Telos Brain is and why it works the
      way it does. Also covers running a local Docker stack with the brain CLI
      (start, stop, deploy, and calling a host app via host.docker.internal)."
    index: 100
    skills:
      - ./concepts/BRA101-telos-brain-core-concepts.md
      - ./concepts/BRA102-company-brain-model.md
      - ./concepts/BRA103-what-is-a-skill-book.md
      - ./concepts/BRA104-getting-started.md
      - ./concepts/BRA105-brain-principles.md
      - ./concepts/BRA106-local-development.md
  - name: Brain Schema
    description: Designing and structuring brain schemas — the configuration that
      defines a Brain's identity, behaviour, capabilities, and knowledge scope.
      Covers schema authoring, field definitions, structure patterns,
      versioning, environment variables and secret/API-key handling, LLM
      providers and model codes for workflows, connectors to external services,
      cloning brain instances, updating a brain from a template, learning-eval
      workflows, skillbook category design and skill ranges, auto-building a
      schema from an existing application, and schema design best practices.
    index: 200
    skills:
      - ./brain-schema/BRA201-brain-schema.md
      - ./brain-schema/BRA202-environment-variables-and-secrets.md
      - ./brain-schema/BRA203-schema-system-tools.md
      - ./brain-schema/BRA204-template-tag-taxonomy.md
      - ./brain-schema/BRA205-cloning-a-brain.md
      - ./brain-schema/BRA206-updating-a-brain-from-a-template.md
      - ./brain-schema/BRA207-learning-eval-workflows.md
      - ./brain-schema/BRA208-designing-skill-books.md
      - ./brain-schema/BRA209-connectors.md
      - ./brain-schema/BRA210-llm-providers-and-models.md
      - ./brain-schema/BRA211-auto-building-a-brain.md
  - name: Run
    description: Using the Telos Brain API and MCP to run and interact with a Brain
      — authentication, endpoints, request and response patterns, MCP
      configuration and usage, error handling, run variables / input-tools, and
      practical patterns for querying and driving a Brain in operation.
    index: 400
    skills:
      - ./run/BRA401-execution-api-authentication-conventions.md
