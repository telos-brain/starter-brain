      - ./run/BRA410-execution-api-transcription.md
      - ./run/BRA411-skill-discovery-system-tools.md
description: "Telos Brain is a self-learning AI Brain, deployed as
  infrastructure from a brain schema and accessed via API.  It works as a
  standalone AI Agent+Brain, or alongside Agent frameworks.  "
