name: get_inbox_entry
version: 2
description: >-
  Retrieves a single inbox entry by its reference, including WorkflowName,
  EntityName, UnitOfWorkName, Weight, Cluster (8-character reference), the full
  markdown body, and all associated tasks. Use after list_inbox_entries to
  read an entry in full.
system:
  tool: get_inbox_entry
parameters:
  - name: inbox_entry_reference
    param: inbox_entry_reference
    description: >-
      Required. The 8-character lowercase alphanumeric reference of the inbox
      entry to retrieve.
    type: string
    required: true
