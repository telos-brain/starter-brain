name: update_inbox_entry
version: 2
description: >-
  Updates an inbox entry's status, routing type, title, and/or body. Status
  transitions are forward-only. Identify the entry by reference — never by UUID.
  Title and body are plain overwrites; prepend previous body yourself when
  consolidating entries.
system:
  tool: update_inbox_entry
parameters:
  - name: inbox_entry_reference
    param: inbox_entry_reference
    description: >-
      Required. The 8-character inbox entry reference. Never pass a UUID.
    type: string
    required: true
  - name: status
    param: status
    description: >-
      Optional. Forward-only status: PENDING, PROCESSED, or COMPLETED.
    type: string
  - name: routing_type
    param: routing_type
    description: >-
      Optional. Routing classification such as SKILL_UPDATE, WORKFLOW_UPDATE,
      TOOL_UPDATE, MEMORY_UPDATE, or SYSTEM_CHANGE.
    type: string
  - name: title
    param: title
    description: >-
      Optional. Short label for the inbox entry (max 500 characters).
      Overwrites the existing title when supplied. Omit to leave the title
      unchanged.
    type: string
  - name: body
    param: body
    description: >-
      Optional. Full signal content in Markdown. Overwrites the existing body
      when supplied. Prepend previous content yourself when history must be
      preserved. Omit to leave the body unchanged.
    type: string
