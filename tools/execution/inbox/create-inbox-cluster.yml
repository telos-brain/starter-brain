name: create_inbox_cluster
version: 2
description: >-
  Consolidates two or more related inbox entries (no upper limit) into a
  single PROCESSED cluster entry. Pass comma-separated source references, a
  cluster title, and a cluster description. Source entries become COMPLETED
  and their open tasks are cancelled. Add apply tasks to the new cluster
  reference immediately.
system:
  tool: create_inbox_cluster
parameters:
  - name: inbox_entry_references
    param: inbox_entry_references
    description: >-
      Required. Comma-separated 8-character lowercase alphanumeric references of
      the inbox entries to cluster (two or more; no upper limit).
    type: string
    required: true
  - name: cluster_title
    param: cluster_title
    description: Required. Title for the new cluster inbox entry (max 500 characters).
    type: string
    required: true
  - name: cluster_description
    param: cluster_description
    description: Required. Body/description for the new cluster inbox entry (markdown).
    type: string
    required: true
