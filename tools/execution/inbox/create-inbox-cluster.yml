name: create_inbox_cluster
version: 2
description: >-
  Consolidates related inbox entries into a single cluster entry. Pass
  comma-separated source references, a cluster title, and a cluster
  description. Already-completed or already-clustered references are ignored.
  Remaining sources become COMPLETED and leave the open inbox. The new cluster
  is PROCESSED.
system:
  tool: create_inbox_cluster
parameters:
  - name: inbox_entry_references
    param: inbox_entry_references
    description: >-
      Required. Comma-separated 8-character lowercase alphanumeric references of
      the inbox entries to cluster (at least two).
    type: string
    required: true
  - name: cluster_title
    param: cluster_title
    description: Required. Title for the new cluster inbox entry (max 500 characters).
    type: string
    required: true
  - name: cluster_description
    param: cluster_description
    description: Required. Body/description for the new cluster inbox entry (markdown).
    type: string
    required: true
