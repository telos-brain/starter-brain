name: set_run_grading
version: 1
description: >-
  Records a quality grade (0–100) against a completed workflow run, optionally
  associating an inbox entry that explains the grade. Used by eval workflows
  after applying their rubric — this tool only persists the score.
system:
  tool: set_run_grading
parameters:
  - name: run_reference
    param: run_reference
    description: >-
      Required. The 8-character lowercase alphanumeric reference of the
      WorkflowRun to grade (from {{run.reference}} in a run-eval workflow —
      not a shortened Guid from telemetry).
    type: string
    required: true
  - name: grading
    param: grading
    description: >-
      Required. Quality score to record, integer 0–100 inclusive.
    type: string
    required: true
  - name: inbox_entry_reference
    param: inbox_entry_reference
    description: >-
      Optional. The 8-character lowercase alphanumeric reference of an
      InboxEntry to associate with this run (typically the primary learning
      just created via create_inbox_entry).
    type: string
