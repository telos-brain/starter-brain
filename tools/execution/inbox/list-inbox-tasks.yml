name: list_inbox_tasks
version: 1
description: >-
  Lists the tasks belonging to a single inbox entry (identified by
  inbox_entry_reference), oldest first. Returns a CSV summary keyed by
  reference. This lists tasks for one entry only, not across the whole brain.
system:
  tool: list_inbox_tasks
parameters:
  - name: inbox_entry_reference
    param: inbox_entry_reference
    description: >-
      Required. The 8-character lowercase alphanumeric reference of the parent
      inbox entry whose tasks to list.
    type: string
    required: true
