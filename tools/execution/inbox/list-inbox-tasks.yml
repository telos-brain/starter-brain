name: list_inbox_tasks
version: 1
description: >-
  Lists tasks for one inbox entry as CSV keyed by Reference. Use before adding
  a task to avoid duplicates.
system:
  tool: list_inbox_tasks
parameters:
  - name: inbox_entry_reference
    param: inbox_entry_reference
    description: >-
      Required. The 8-character reference of the parent inbox entry. Never pass
      a UUID.
    type: string
    required: true
