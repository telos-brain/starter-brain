name: Inbox
description: >-
  System tools for the learning-signal inbox — create entries, list/read/update
  entries and tasks, route work by adding workflow-linked tasks, and persist
  run grading scores from eval workflows.
tools:
  - create-inbox-entry.yml
  - list-inbox-entries.yml
  - get-inbox-entry.yml
  - update-inbox-entry.yml
  - list-inbox-tasks.yml
  - add-inbox-task.yml
  - update-inbox-task.yml
  - set-run-grading.yml
