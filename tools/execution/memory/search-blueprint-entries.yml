name: search_blueprint_entries
version: 3
description: >-
  Searches memory entries for the ones most relevant to a query. Returns CSV
  Blueprint,Category,Title,Score. Pass those three values to get_blueprint_entry
  to read a result in full. Optionally restrict with category. Pass blueprint
  (code or title) to search one blueprint; omit it to search every blueprint
  at the current scope.
system:
  tool: search_blueprint_entries
parameters:
  - name: query
    param: query
    description: >-
      A description of what you are looking for; the most semantically similar
      entries are returned.
    type: string
    required: true
  - name: category
    param: category
    description: Optional. Restrict the search to entries filed under this category name.
    type: string
    required: false
  - name: max_results
    param: max_results
    description: Optional. Maximum number of entries to return (default 5).
    type: string
    required: false
  - name: blueprint
    param: blueprint
    description: >-
      Optional. Code or title of the blueprint to use. When omitted, every
      blueprint at the current scope is included. When set, only that blueprint
      is used. An unknown name is an error and does not fall back to another
      blueprint.
    type: string
    required: false
