name: add_blueprint_entry
version: 2
description: >-
  Adds a new entry to a memory blueprint under an existing category.
  Use to record a distilled, reusable insight. Fails if an entry with the same
  title already exists. Pass blueprint when more than one blueprint is in
  scope; otherwise the target is resolved from the run's context.
system:
  tool: add_blueprint_entry
parameters:
  - name: category
    param: category
    description: The name of an existing category to file the entry under (e.g. "Insights").
    type: string
    required: true
  - name: title
    param: title
    description: A short, unique title for the entry.
    type: string
    required: true
  - name: content
    param: content
    description: The entry content as Markdown.
    type: string
    required: true
  - name: blueprint
    param: blueprint
    description: >-
      Optional. Code or title of the blueprint to write when more than one is
      in scope (for example company or Company). Omit when only one blueprint
      is available.
    type: string
    required: false
