name: add_blueprint_entry
version: 3
description: >-
  Adds a new entry to a memory blueprint under an existing category. Use to
  record distilled, reusable knowledge. Pass blueprint (code or title) when
  more than one blueprint exists at the current scope. Fails if an entry with
  the same title already exists. Use update_blueprint_entry to change an
  existing entry.
system:
  tool: add_blueprint_entry
parameters:
  - name: category
    param: category
    description: The name of an existing category to file the entry under (e.g. "Insights").
    type: string
    required: true
  - name: title
    param: title
    description: A short, unique title for the entry.
    type: string
    required: true
  - name: content
    param: content
    description: The entry content as Markdown.
    type: string
    required: true
  - name: blueprint
    param: blueprint
    description: >-
      Optional. Code or title of the blueprint to use. Required when more than
      one blueprint exists at the current scope. A scope with a single
      blueprint may omit it. An unknown name is an error and does not fall
      back to another blueprint.
    type: string
    required: false
