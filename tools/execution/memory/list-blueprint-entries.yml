name: list_blueprint_entries
version: 2
description: >-
  Lists the entries in a memory blueprint for the current context, optionally
  filtered by category. Returns CSV with columns Title,Category, UpdatedAt.
  Pass blueprint when more than one blueprint is in scope; otherwise the target
  is resolved from the run's context. Use get_blueprint_entry to read an entry
  in full.
system:
  tool: list_blueprint_entries
parameters:
  - name: category
    param: category
    description: Optional. Only list entries filed under this category name. Omit to list all entries.
    type: string
    required: false
  - name: blueprint
    param: blueprint
    description: >-
      Optional. Code or title of the blueprint to list when more than one is in
      scope (for example company or Company). Omit when only one blueprint is
      available.
    type: string
    required: false
