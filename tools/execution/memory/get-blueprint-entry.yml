name: get_blueprint_entry
version: 2
description: >-
  Retrieves a single memory entry by its category and title and returns its full
  content. Pass blueprint when more than one blueprint is in scope; otherwise
  the target is resolved from the run's context. Use after
  search_blueprint_entries or list_blueprint_entries to read an entry in full.
system:
  tool: get_blueprint_entry
parameters:
  - name: category
    param: category
    description: The name of the category the entry is filed under.
    type: string
    required: true
  - name: title
    param: title
    description: The exact title of the entry to retrieve.
    type: string
    required: true
  - name: blueprint
    param: blueprint
    description: >-
      Optional. Code or title of the blueprint that holds the entry when more
      than one is in scope (for example company or Company). Omit when only one
      blueprint is available.
    type: string
    required: false
