name: get_blueprint_entry
version: 3
description: >-
  Retrieves a single memory entry by its category and title and returns its
  full content. Pass blueprint (code or title) when more than one blueprint
  exists at the current scope. The named category is tried first; if it is
  missing or the title is not there, the lookup falls back to any category in
  that blueprint. When several entries share the title, a
  Blueprint,Category,Title list is returned so you can retry with a specific
  triple.
system:
  tool: get_blueprint_entry
parameters:
  - name: category
    param: category
    description: >-
      The name of the category the entry is filed under. Tried first; if it is
      missing or the title is not there, other categories in the same blueprint
      are searched.
    type: string
    required: true
  - name: title
    param: title
    description: The exact title of the entry to retrieve.
    type: string
    required: true
  - name: blueprint
    param: blueprint
    description: >-
      Optional. Code or title of the blueprint to use. Required when more than
      one blueprint exists at the current scope. A scope with a single
      blueprint may omit it. An unknown name is an error and does not fall
      back to another blueprint.
    type: string
    required: false
