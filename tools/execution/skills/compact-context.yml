name: compact_context
version: 1
description: >-
  Compacts the conversation context by summarising older turns via the brain's
  COMPACTION workflow (WF-COMPACT). Use when the dialogue is long and earlier
  detail is no longer needed in full. Requires no parameters. 
system:
  tool: compact_context
# No parameters — the harness supplies run scope; the tool summarises the
# current WorkflowRun's message history.
parameters: []
on-error: |
  Confirm the brain has an active COMPACTION workflow (e.g. WF-COMPACT) before
  retrying. Compaction is fail-open: if summarisation fails, continue with the
  existing uncompacted context.
