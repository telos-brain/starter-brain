name: find_available_tools
version: 2
description: >-
  Searches the workflow's available tools for those most relevant to a query and
  returns their names and descriptions. Call activate_tools with the names you
  intend to use. This result does not make them callable.
system:
  tool: find_available_tools
parameters:
  - name: query
    param: query
    description: >-
      A description of what you need; the most semantically similar available
      tools are returned.
    type: string
    required: true
