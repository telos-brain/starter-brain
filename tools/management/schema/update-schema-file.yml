name: update_schema_file
version: 1
description: >-
  Edits or creates a schema file and persists it. For updates: provide
  str_replace_old copied verbatim from get_schema_file (must match exactly once).
  For creates: set str_replace_old to "" and str_replace_new to the full file
  content. Version bumps automatically. brain-compose.yml cannot be edited.
system:
  tool: update_schema_file
parameters:
  - name: path
    param: path
    description: >-
      The schema file path to edit or create, e.g.
      "skills/telos-brain/concepts/BRA103-what-is-a-skill-book.md".
    type: string
    required: true
  - name: str_replace_old
    param: str_replace_old
    description: >-
      For updates: the exact text to find, copied verbatim from get_schema_file
      (must match exactly once). For creates: pass an empty string.
    type: string
    required: true
  - name: str_replace_new
    param: str_replace_new
    description: >-
      The replacement text, or the full new file content when creating. Use an
      empty string to delete a matched substring on update.
    type: string
    required: true
