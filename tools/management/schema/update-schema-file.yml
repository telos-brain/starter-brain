name: update_schema_file
version: 2
description: >-
  Applies a targeted string-replace edit to a single schema file and persists
  it. Provide str_replace_old copied verbatim from get_schema_file; it must
  match exactly once. The file's version is bumped automatically. Do not use
  this to create files — use create_schema_file (or create_skill for skills).
  Generated manifests cannot be edited: brain-compose.yml, tools/*/tools.yml,
  skills/*/skillbook.yml, blueprints/*/blueprint.yml.
system:
  tool: update_schema_file
parameters:
  - name: path
    param: path
    description: >-
      The schema file path to edit, e.g.
      "skills/telos-brain/concepts/BRA103-what-is-a-skill-book.md".
    type: string
    required: true
  - name: str_replace_old
    param: str_replace_old
    description: >-
      The exact text to find, copied verbatim from get_schema_file. Must match
      exactly once — include enough surrounding context to be unique.
    type: string
    required: true
  - name: str_replace_new
    param: str_replace_new
    description: The replacement text. Use an empty string to delete the matched text.
    type: string
    required: true
